<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設備A 作業手順</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 22px;
    }

    .warning {
      background: #ffe5e5;
      border-left: 5px solid red;
      padding: 10px;
      margin: 15px 0;
      font-weight: bold;
    }

    .photo {
      position: relative;
      margin: 15px 0;
    }

    .photo img {
      width: 100%;
      border-radius: 8px;
    }

    .arrow {
      position: absolute;
      top: 40%;
      left: 60%;
      font-size: 40px;
      color: red;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .video {
      display: block;
      background: #1976d2;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>設備A 作業手順</h1>

<p>① 電源がOFFになっていることを確認する。</p>
<p>② 安全カバーを外す。</p>

<div class="warning">
⚠ 高温部があります。手袋を必ず着用してください。
</div>

<div class="photo">
  <img src="machine.jpg" alt="設備写真">
  <div class="arrow">⬇</div>
</div>

<a class="video" href="https://youtu.be/g6563Yqkw88" target="_blank">
▶ 動画で作業を確認する
</a>

</body>
</html>
