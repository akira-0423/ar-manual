<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Test</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      
    <a-marker preset="hiro">

  <!-- 赤い丸（②の背景） -->
  <a-circle
    position="0 0.8 0"
    rotation="-90 0 0"
    radius="0.35"
    color="red"
    onclick="openPDF()">
  </a-circle>

  <!-- 赤い数字② -->
  <a-text
    value="②"
    position="0 0.81 0"
    rotation="-90 0 0"
    align="center"
    color="red"
    scale="2 2 2">
  </a-text>

</a-marker>

      <a-entity camera></a-entity>
    </a-scene>
    
<script>
function openPDF() {
  window.open("PDF/06.pdf", "_blank");
}
</script>
    
  </body>
</html>
